[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sealscan"
dynamic = ["version"]
description = "Local-only scanner for secrets, insecure code and license risks. Scan before you ship."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "secrets", "license", "scanner", "cli", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
sealscan = "sealscan.cli:main"

[tool.setuptools]
packages = ["sealscan"]

[tool.setuptools.dynamic]
version = { attr = "sealscan.__version__" }
